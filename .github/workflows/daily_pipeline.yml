name: Daily Knowledge Broadening Pipeline

on:
  schedule:
# Runs daily at 8:30 AM UTC
    - cron: '17 5 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab in GitHub

jobs:
  run-pipeline:
    name: Run Educational Content Generation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pipeline Script
        env:
          # API Tokens and Identifiers
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_TTS_CREDENTIALS: ${{ secrets.GCP_TTS_CREDENTIALS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          
          # Optional custom configuration (if not set, the script auto-detects them!)
          NOTION_COLUMN_TOPIC: ${{ secrets.NOTION_COLUMN_TOPIC }}
          NOTION_COLUMN_SUMMARY: ${{ secrets.NOTION_COLUMN_SUMMARY }}
          NOTION_COLUMN_SCRIPT: ${{ secrets.NOTION_COLUMN_SCRIPT }}
          GCP_TTS_VOICE_NAME: ${{ secrets.GCP_TTS_VOICE_NAME }}
          GCP_TTS_LANGUAGE_CODE: ${{ secrets.GCP_TTS_LANGUAGE_CODE }}
        run: python app.py
